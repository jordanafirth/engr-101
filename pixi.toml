[workspace]
name = "engr-101"
version = "0.1.0"
description = "Engr 101 guided engineering notebooks"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2.2,<3"
matplotlib-base = ">=3.9,<4"
jupyterlab = ">=4.3,<5"
ipykernel = ">=6.29,<8"
nbformat = ">=5.10,<6"
nbclient = ">=0.10,<1"
scipy = ">=1.14,<2"

[tasks]
lab = "jupyter lab projects/rocket_prediction/rocket_prediction.ipynb"
check = "python tools/check_rocket_project.py"
